spring.application.name=cinema-booking

spring.datasource.url=jdbc:mysql://localhost:3306/cinema_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=change_me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CSDL duoc tao san bang sql/schema.sql (xem HUONG_DAN_TRIEN_KHAI_DAT_VE_PHIM.md muc 1)
# -> Hibernate chi kiem tra Entity co khop bang, khong tu tao/sua bang.
spring.jpa.hibernate.ddl-auto=validate
# Script SQL dung ten bang/cot chuan PascalCase (Users, BookingSeats, SeatRow...).
# Phai tat physical naming strategy mac dinh cua Spring Boot (vien no se tu doi ten
# thanh snake_case/lowercase) de Hibernate validate dung ten da khai bao trong @Table/@Column.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080
