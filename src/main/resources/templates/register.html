<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đăng ký - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content d-flex align-items-center justify-content-center py-4">
    <div class="auth-card w-100" style="max-width: 540px;">
        <div class="text-center mb-4">
            <div class="cb-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="bi bi-person-plus"></i>
            </div>
            <h3 class="fw-bold mb-1">Tạo tài khoản mới</h3>
            <p class="text-muted small mb-0">Trở thành thành viên CinemaBooking chỉ trong 30 giây</p>
        </div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="vd: khachhang01"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold small">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nhập họ và tên đầy đủ"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-7">
                    <label class="form-label fw-semibold small">Email <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold small">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="09xxxxxxxx"/>
                </div>
            </div>

            <button type="submit" class="btn btn-cb-primary w-100 py-2 mt-4">
                <i class="bi bi-check2-circle me-1"></i> Hoàn tất đăng ký
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small">
            <span class="text-muted">Đã có tài khoản?</span>
            <a href="/login" class="fw-bold text-danger text-decoration-none ms-1">Đăng nhập</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
