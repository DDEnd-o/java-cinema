<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>404 - Không tìm thấy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container page-content d-flex align-items-center justify-content-center text-center py-5">
    <div class="auth-card" style="max-width: 480px;">
        <div class="text-warning mb-3" style="font-size: 3.5rem;"><i class="bi bi-compass"></i></div>
        <h1 class="fw-bold display-5 mb-2">404</h1>
        <h5 class="fw-bold mb-2">Không tìm thấy trang</h5>
        <p class="text-muted small mb-4" th:text="${message != null ? message : 'Nội dung bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.'}">Không tìm thấy nội dung.</p>
        <a href="/" class="btn btn-cb-primary px-4"><i class="bi bi-house-door me-1"></i>Về trang chủ</a>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
