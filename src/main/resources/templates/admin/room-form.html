<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Thêm phòng chiếu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 560px;">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link active"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="bg-white rounded-4 border p-4 shadow-sm">
        <h4 class="fw-bold mb-2">Thêm phòng chiếu mới</h4>
        <p class="text-muted small mb-4">
            Hệ thống sẽ tự động khởi tạo sơ đồ ghế theo số hàng (A, B, C...) và số ghế mỗi hàng. Sau khi tạo xong, bạn có thể vào mục <strong>Cấu hình ghế VIP</strong> để đánh dấu các hàng ghế VIP.
        </p>

        <form th:action="@{/admin/rooms}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Tên phòng chiếu <span class="text-danger">*</span></label>
                <input type="text" name="roomName" class="form-control" placeholder="Ví dụ: Phòng 3 (IMAX)" required/>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label fw-semibold small">Số hàng ghế (A, B...)</label>
                    <input type="number" name="rows" class="form-control" value="5" min="1" max="20" required/>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold small">Số ghế mỗi hàng</label>
                    <input type="number" name="seatsPerRow" class="form-control" value="8" min="1" max="26" required/>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-cb-primary px-4">
                    <i class="bi bi-plus-circle me-1"></i> Tạo phòng chiếu
                </button>
                <a href="/admin/rooms" class="btn btn-outline-secondary px-4">Hủy</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
