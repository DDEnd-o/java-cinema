<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Ghế phòng chiếu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 820px;">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link active"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-1" th:text="${room.roomName}"></h4>
            <p class="text-muted small mb-0">
                Tổng sức chứa: <strong th:text="${room.totalSeats}"></strong> ghế &middot;
                Nhấn vào từng ghế bên dưới để chuyển đổi giữa <strong>Standard</strong> và <strong>VIP</strong>.
            </p>
        </div>
        <a href="/admin/rooms" class="btn btn-sm btn-outline-secondary rounded-3">
            <i class="bi bi-arrow-left me-1"></i> Danh sách phòng
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/admin/rooms/{id}/seats(id=${room.roomId})}" method="post">
        <div class="auditorium-card mb-4">
            <div class="screen-container">
                <div class="screen-bar"></div>
                <div class="screen-label">Màn hình chiếu</div>
            </div>

            <div class="seat-map">
                <div class="seat-row" th:each="rowEntry : ${seatsByRow}">
                    <span class="seat-row-label" th:text="${rowEntry.key}"></span>
                    <label class="seat" th:each="seat : ${rowEntry.value}"
                           th:classappend="${seat.seatType.name()}"
                           style="display:flex; flex-direction:column; cursor:pointer;">
                        <input type="checkbox" name="vipSeatIds" th:value="${seat.seatId}"
                               th:checked="${seat.seatType.name() == 'vip'}" style="display:none;"
                               onchange="this.parentElement.classList.toggle('vip', this.checked); this.parentElement.classList.toggle('standard', !this.checked);"/>
                        <span th:text="${seat.seatNumber}"></span>
                    </label>
                    <span class="seat-row-label" th:text="${rowEntry.key}"></span>
                </div>
            </div>

            <div class="seat-legend">
                <span class="seat-legend-item"><span class="seat-legend-box seat standard"></span> Ghế Standard</span>
                <span class="seat-legend-item"><span class="seat-legend-box seat vip"></span> Ghế VIP (Đã tích chọn)</span>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="/admin/rooms" class="btn btn-outline-secondary px-4">Quay lại</a>
            <button type="submit" class="btn btn-cb-primary px-4">
                <i class="bi bi-check2-circle me-1"></i> Lưu cấu hình ghế
            </button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
