<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Phim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 820px;">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link active"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="bg-white rounded-4 border p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h4 class="fw-bold mb-0" th:text="${movie.movieId} != null ? 'Chỉnh sửa thông tin phim' : 'Thêm bộ phim mới'"></h4>
            <a href="/admin/movies" class="btn btn-sm btn-outline-secondary rounded-3">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
        </div>

        <form th:action="${movie.movieId} != null ? @{/admin/movies/{id}(id=${movie.movieId})} : @{/admin/movies}"
              th:object="${movie}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Tên phim <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="Nhập tên bộ phim..." required/>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-7">
                            <label class="form-label fw-semibold small">Thể loại</label>
                            <input type="text" th:field="*{genre}" class="form-control" placeholder="Hành động, Viễn tưởng..."/>
                        </div>
                        <div class="col-sm-5">
                            <label class="form-label fw-semibold small">Thời lượng (phút) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{durationMinutes}" class="form-control" min="1" placeholder="120" required/>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold small">Ngày khởi chiếu</label>
                            <input type="date" th:field="*{releaseDate}" class="form-control"/>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold small">Trạng thái phát hành</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="showing">Đang chiếu (Showing)</option>
                                <option value="upcoming">Sắp chiếu (Upcoming)</option>
                                <option value="ended">Đã kết thúc (Ended)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Đường dẫn ảnh Poster (URL)</label>
                        <input type="text" th:field="*{posterUrl}" id="posterUrlInput" class="form-control"
                               placeholder="/images/posters/movie1.svg"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Mô tả / Nội dung tóm tắt</label>
                        <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập tóm tắt nội dung phim..."></textarea>
                    </div>
                </div>

                <!-- Live Poster Preview -->
                <div class="col-md-4 text-center">
                    <label class="form-label fw-semibold small d-block">Xem trước Poster</label>
                    <div class="p-2 bg-light rounded-3 border d-inline-block">
                        <img id="posterPreview"
                             th:src="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl) ? movie.posterUrl : '/images/posters/placeholder.svg'}"
                             alt="Poster Preview" class="rounded-2"
                             style="width: 180px; height: 270px; object-fit: cover;"
                             onerror="this.src='/images/posters/placeholder.svg'"/>
                    </div>
                </div>
            </div>

            <div class="pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-cb-primary px-4">
                    <i class="bi bi-check2-circle me-1"></i> Lưu thông tin
                </button>
                <a href="/admin/movies" class="btn btn-outline-secondary px-4">Hủy</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.getElementById('posterUrlInput');
        var preview = document.getElementById('posterPreview');
        if (input && preview) {
            input.addEventListener('input', function () {
                var val = input.value.trim();
                if (val) preview.src = val;
            });
        }
    });
</script>
</body>
</html>
