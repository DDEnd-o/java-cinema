<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Phim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content">
    <!-- Admin Quick Navigation -->
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link active"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="cb-section-header">
        <h4 class="cb-section-title">
            <span class="cb-section-dot"></span>
            Danh sách Phim
            <span class="badge bg-secondary bg-opacity-10 text-secondary fs-6 fw-normal ms-1" th:text="${#lists.size(movies)}"></span>
        </h4>
        <a href="/admin/movies/new" class="btn btn-cb-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i> Thêm phim mới
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="cb-table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Bộ phim</th>
                    <th>Thể loại</th>
                    <th>Thời lượng</th>
                    <th>Khởi chiếu</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movies}">
                    <td class="text-muted fw-semibold">#<span th:text="${m.movieId}"></span></td>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <img th:src="${m.posterUrl != null and !#strings.isEmpty(m.posterUrl) ? m.posterUrl : '/images/posters/placeholder.svg'}"
                                 alt="poster" class="rounded-2 border"
                                 style="width: 42px; height: 60px; object-fit: cover;"
                                 onerror="this.src='/images/posters/placeholder.svg'"/>
                            <div>
                                <div class="fw-bold text-dark" th:text="${m.title}"></div>
                                <a th:href="@{/movies/{id}(id=${m.movieId})}" class="small text-muted text-decoration-none">
                                    Xem trang phim <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </div>
                        </div>
                    </td>
                    <td><span class="text-secondary small" th:text="${m.genre}"></span></td>
                    <td><span class="fw-semibold" th:text="${m.durationMinutes} + ' phút'"></span></td>
                    <td>
                        <span class="small text-muted" th:text="${m.releaseDate != null ? #temporals.format(m.releaseDate, 'dd/MM/yyyy') : '—'}"></span>
                    </td>
                    <td>
                        <span th:switch="${m.status.name()}">
                            <span th:case="'showing'" class="badge bg-success rounded-pill px-3 py-2">Đang chiếu</span>
                            <span th:case="'upcoming'" class="badge bg-warning text-dark rounded-pill px-3 py-2">Sắp chiếu</span>
                            <span th:case="*" class="badge bg-secondary rounded-pill px-3 py-2">Đã kết thúc</span>
                        </span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/movies/{id}/edit(id=${m.movieId})}" class="btn btn-sm btn-outline-primary rounded-3 me-1">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </a>
                        <form th:action="@{/admin/movies/{id}/delete(id=${m.movieId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa phim này? Mọi suất chiếu liên quan cũng sẽ bị xóa.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-3">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
