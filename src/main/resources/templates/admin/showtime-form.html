<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Suất chiếu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 620px;" th:with="isEdit=${showtime != null}">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link active"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="bg-white rounded-4 border p-4 shadow-sm">
        <h4 class="fw-bold mb-4 pb-3 border-bottom" th:text="${isEdit} ? 'Chỉnh sửa suất chiếu' : 'Tạo suất chiếu mới'"></h4>

        <form th:action="${isEdit} ? @{/admin/showtimes/{id}(id=${showtime.showtimeId})} : @{/admin/showtimes}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Chọn bộ phim <span class="text-danger">*</span></label>
                <select name="movieId" class="form-select" required>
                    <option th:each="m : ${movies}" th:value="${m.movieId}" th:text="${m.title + ' (' + m.durationMinutes + ' phút)'}"
                            th:selected="${isEdit} and ${showtime.movie.movieId} == ${m.movieId}"></option>
                </select>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">Phòng chiếu <span class="text-danger">*</span></label>
                    <select name="roomId" class="form-select" required>
                        <option th:each="r : ${rooms}" th:value="${r.roomId}" th:text="${r.roomName + ' (' + r.totalSeats + ' ghế)'}"
                                th:selected="${isEdit} and ${showtime.room.roomId} == ${r.roomId}"></option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">Giá vé (VNĐ) <span class="text-danger">*</span></label>
                    <input type="number" step="1000" name="price" class="form-control" placeholder="85000" required
                           th:value="${isEdit} ? ${showtime.price} : null"/>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">Thời gian bắt đầu <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="startTime" class="form-control" required
                           th:value="${isEdit} ? ${#temporals.format(showtime.startTime, 'yyyy-MM-dd''T''HH:mm')} : null"/>
                </div>
                <div class="col-sm-6">
                    <label class="form-label fw-semibold small">Thời gian kết thúc <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="endTime" class="form-control" required
                           th:value="${isEdit} ? ${#temporals.format(showtime.endTime, 'yyyy-MM-dd''T''HH:mm')} : null"/>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-cb-primary px-4">
                    <i class="bi bi-check2-circle me-1"></i> Lưu suất chiếu
                </button>
                <a href="/admin/showtimes" class="btn btn-outline-secondary px-4">Hủy</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
