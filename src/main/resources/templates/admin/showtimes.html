<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Suất chiếu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link active"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="cb-section-header">
        <h4 class="cb-section-title">
            <span class="cb-section-dot"></span>
            Quản lý Lịch &amp; Suất chiếu
        </h4>
        <a href="/admin/showtimes/new" class="btn btn-cb-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i> Thêm suất chiếu
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="cb-table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Bộ phim</th>
                    <th>Phòng chiếu</th>
                    <th>Khung giờ chiếu</th>
                    <th>Giá vé</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="st : ${showtimes}">
                    <td>
                        <div class="fw-bold text-white" th:text="${st.movie.title}"></div>
                    </td>
                    <td>
                        <span class="badge rounded-pill px-3 py-2"
                              style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);"
                              th:text="${st.room.roomName}"></span>
                    </td>
                    <td>
                        <i class="bi bi-calendar-event text-muted me-1"></i>
                        <span class="fw-semibold" th:text="${#temporals.format(st.startTime, 'dd/MM/yyyy')}"></span>
                        <span class="badge rounded-pill ms-1 px-2 py-1"
                              style="background: rgba(255, 255, 255, 0.08); color: #f8fafc;"
                              th:text="${#temporals.format(st.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(st.endTime, 'HH:mm')}"></span>
                    </td>
                    <td>
                        <span class="fw-bold text-warning" th:text="${#numbers.formatInteger(st.price, 1, 'POINT')} + 'đ'"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/booking/{id}/seats(id=${st.showtimeId})}" class="btn btn-sm btn-outline-secondary rounded-3 me-1" title="Xem sơ đồ ghế">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/admin/showtimes/{id}/edit(id=${st.showtimeId})}" class="btn btn-sm btn-outline-info rounded-3 me-1">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </a>
                        <form th:action="@{/admin/showtimes/{id}/delete(id=${st.showtimeId})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa suất chiếu này? Mọi vé đã đặt cho suất này cũng sẽ bị xóa.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-3">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
