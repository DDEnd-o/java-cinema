<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản trị - Vé đã bán</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content">
    <div class="admin-subnav">
        <a href="/admin/movies" class="admin-subnav-link"><i class="bi bi-camera-reels"></i> Quản lý Phim</a>
        <a href="/admin/rooms" class="admin-subnav-link"><i class="bi bi-grid-3x3-gap"></i> Phòng chiếu &amp; Ghế</a>
        <a href="/admin/showtimes" class="admin-subnav-link"><i class="bi bi-calendar2-week"></i> Lịch &amp; Suất chiếu</a>
        <a href="/admin/bookings" class="admin-subnav-link active"><i class="bi bi-receipt-cutoff"></i> Vé đã bán</a>
    </div>

    <div class="cb-section-header">
        <h4 class="cb-section-title">
            <span class="cb-section-dot"></span>
            Quản lý Đơn đặt vé
        </h4>
        <span class="badge rounded-pill px-3 py-2"
              style="background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3);"
              th:text="'Tổng số: ' + ${#lists.size(bookings)} + ' đơn vé'"></span>
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="text-muted mt-2 mb-0">Hệ thống chưa ghi nhận đơn đặt vé nào.</p>
    </div>

    <div class="cb-table-card" th:if="${!#lists.isEmpty(bookings)}">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Mã vé</th>
                    <th>Khách hàng</th>
                    <th>Bộ phim</th>
                    <th>Suất chiếu &amp; Phòng</th>
                    <th>Ghế ngồi</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thời điểm đặt</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td class="fw-bold font-monospace text-warning">#<span th:text="${b.bookingId}"></span></td>
                    <td>
                        <div class="fw-semibold text-white" th:text="${b.user.fullName}"></div>
                        <div class="text-muted" style="font-size: 0.78rem;" th:text="'@' + ${b.user.username}"></div>
                    </td>
                    <td class="fw-bold text-white" th:text="${b.showtime.movie.title}"></td>
                    <td>
                        <div class="small fw-semibold" th:text="${#temporals.format(b.showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></div>
                        <span class="badge rounded-pill mt-1" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;" th:text="${b.showtime.room.roomName}"></span>
                    </td>
                    <td>
                        <span class="seat-badge-pill" th:text="${seatLabelsByBooking.get(b.bookingId)}"></span>
                    </td>
                    <td>
                        <span class="fw-bold" style="color: #ff5c83;" th:text="${#numbers.formatInteger(b.totalAmount, 1, 'POINT')} + 'đ'"></span>
                    </td>
                    <td>
                        <span th:switch="${b.status.name()}">
                            <span th:case="'paid'" class="badge bg-success rounded-pill px-3 py-2">Đã thanh toán</span>
                            <span th:case="'pending'" class="badge bg-warning text-dark rounded-pill px-3 py-2">Chờ thanh toán</span>
                            <span th:case="*" class="badge bg-secondary rounded-pill px-3 py-2">Đã hủy</span>
                        </span>
                    </td>
                    <td class="text-muted small" th:text="${#temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
