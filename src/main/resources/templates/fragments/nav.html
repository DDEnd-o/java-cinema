<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark cb-navbar sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand cb-brand" href="/">
            <span class="cb-brand-icon"><i class="bi bi-film"></i></span>
            <span>Cinema<span class="highlight">Booking</span></span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#cbNavbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="cbNavbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                <li class="nav-item">
                    <a class="cb-nav-link" href="/"><i class="bi bi-house-door"></i> Trang chủ</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="cb-nav-link" href="/account/bookings"><i class="bi bi-ticket-perforated"></i> Vé của tôi</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="cb-nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-shield-lock"></i> Quản trị hệ thống
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark shadow border-secondary mt-2" style="border-radius: 12px;">
                        <li><a class="dropdown-item py-2" href="/admin/movies"><i class="bi bi-camera-reels me-2 text-danger"></i>Quản lý Phim</a></li>
                        <li><a class="dropdown-item py-2" href="/admin/rooms"><i class="bi bi-grid-3x3-gap me-2 text-warning"></i>Phòng chiếu &amp; Ghế</a></li>
                        <li><a class="dropdown-item py-2" href="/admin/showtimes"><i class="bi bi-calendar2-week me-2 text-info"></i>Lịch &amp; Suất chiếu</a></li>
                        <li><hr class="dropdown-divider border-secondary"/></li>
                        <li><a class="dropdown-item py-2" href="/admin/bookings"><i class="bi bi-receipt-cutoff me-2 text-success"></i>Danh sách Vé đã bán</a></li>
                    </ul>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div sec:authorize="isAuthenticated()" class="cb-user-pill">
                    <i class="bi bi-person-circle text-danger"></i>
                    <span>Xin chào, <strong sec:authentication="name">user</strong></span>
                </div>

                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </form>

                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="/login">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                    <a class="btn btn-cb-primary btn-sm rounded-pill px-3" href="/register">
                        <i class="bi bi-person-plus me-1"></i>Đăng ký
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
