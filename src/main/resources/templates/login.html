<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đăng nhập - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content d-flex align-items-center justify-content-center py-4">
    <div class="auth-card w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="cb-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="bi bi-film"></i>
            </div>
            <h3 class="fw-bold mb-1">Chào mừng trở lại</h3>
            <p class="text-muted small mb-0">Đăng nhập để đặt vé và quản lý lịch sử vé của bạn</p>
        </div>

        <div th:if="${success}" class="alert alert-success border-0 small rounded-3">
            <i class="bi bi-check-circle-fill me-1"></i><span th:text="${success}"></span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger border-0 small rounded-3">
            <i class="bi bi-exclamation-circle-fill me-1"></i>Sai tên đăng nhập hoặc mật khẩu.
        </div>
        <div th:if="${param.logout}" class="alert alert-info border-0 small rounded-3">
            <i class="bi bi-info-circle-fill me-1"></i>Bạn đã đăng xuất khỏi hệ thống.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập username..." required autofocus/>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu..." required/>
                </div>
            </div>
            <button type="submit" class="btn btn-cb-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small">
            <span class="text-muted">Chưa có tài khoản?</span>
            <a href="/register" class="fw-bold text-danger text-decoration-none ms-1">Đăng ký ngay</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
