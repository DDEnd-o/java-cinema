<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đặt vé thành công - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 620px;">
    <!-- Booking Stepper -->
    <div class="booking-stepper">
        <div class="step-item done">
            <span class="step-num"><i class="bi bi-check"></i></span>
            <span>Chọn ghế ngồi</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item done">
            <span class="step-num"><i class="bi bi-check"></i></span>
            <span>Thanh toán</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item active">
            <span class="step-num">3</span>
            <span>Nhận vé điện tử</span>
        </div>
    </div>

    <div class="ticket-card">
        <div class="ticket-header text-center py-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                 style="width: 64px; height: 64px; font-size: 2rem; background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);">
                <i class="bi bi-check-lg"></i>
            </div>
            <h4 class="fw-bold mb-1 text-white">Đặt Vé Thành Công!</h4>
            <p class="small text-muted mb-0">Vui lòng xuất trình vé điện tử bên dưới tại quầy soát vé</p>
        </div>

        <div class="ticket-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <div class="text-muted small">Bộ phim</div>
                    <h4 class="fw-bold mb-0 text-white" th:text="${booking.showtime.movie.title}"></h4>
                </div>
                <span th:switch="${booking.status.name()}">
                    <span th:case="'paid'" class="badge bg-success rounded-pill px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i>Đã thanh toán</span>
                    <span th:case="'pending'" class="badge bg-warning text-dark rounded-pill px-3 py-2">Chờ thanh toán</span>
                    <span th:case="*" class="badge bg-secondary rounded-pill px-3 py-2">Đã hủy</span>
                </span>
            </div>

            <div class="row g-3 bg-light rounded-4 p-3 border mx-0 mb-2">
                <div class="col-6">
                    <div class="text-muted small">Mã đơn vé</div>
                    <div class="fw-bold text-warning fs-5 font-monospace">#<span th:text="${booking.bookingId}"></span></div>
                </div>
                <div class="col-6">
                    <div class="text-muted small">Phòng chiếu</div>
                    <div class="fw-bold text-info fs-5" th:text="${booking.showtime.room.roomName}"></div>
                </div>
                <div class="col-6">
                    <div class="text-muted small">Suất chiếu</div>
                    <div class="fw-bold text-white" th:text="${#temporals.format(booking.showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></div>
                </div>
                <div class="col-6">
                    <div class="text-muted small">Tổng thanh toán</div>
                    <div class="fw-bold fs-5" style="color: #ff5c83;" th:text="${#numbers.formatInteger(booking.totalAmount, 1, 'POINT')} + 'đ'"></div>
                </div>
                <div class="col-12 pt-2 border-top">
                    <div class="text-muted small mb-2">Ghế ngồi đã đặt</div>
                    <div class="d-flex flex-wrap gap-2">
                        <span th:each="bs : ${bookingSeats}" class="seat-badge-pill" th:text="${bs.seat.label}"></span>
                    </div>
                </div>
            </div>

            <div class="ticket-divider"></div>

            <div class="text-center mb-4 p-3 rounded-4" style="background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12);">
                <i class="bi bi-qr-code fs-1 d-block text-white lh-1 mb-2"></i>
                <span class="font-monospace small text-warning fw-bold" th:text="'CINEVERSE-TICKET-#' + ${booking.bookingId}"></span>
            </div>

            <div class="d-flex gap-3">
                <a href="/" class="btn btn-outline-secondary w-50 rounded-3 py-2">
                    <i class="bi bi-house-door me-1"></i> Trang chủ
                </a>
                <a href="/account/bookings" class="btn btn-cb-primary w-50 py-2">
                    <i class="bi bi-ticket-perforated me-1"></i> Lịch sử vé
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
