<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Chọn ghế - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content">
    <!-- Booking Stepper -->
    <div class="booking-stepper">
        <div class="step-item active">
            <span class="step-num">1</span>
            <span>Chọn ghế ngồi</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
            <span class="step-num">2</span>
            <span>Thanh toán</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
            <span class="step-num">3</span>
            <span>Nhận vé điện tử</span>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/booking}" method="post" id="bookingForm">
        <input type="hidden" name="showtimeId" th:value="${showtime.showtimeId}"/>
        <div id="seatIdsContainer"></div>

        <div class="row g-4 align-items-start">
            <!-- Left: Auditorium Seat Map -->
            <div class="col-lg-8">
                <div class="auditorium-card">
                    <div class="screen-container">
                        <div class="screen-bar"></div>
                        <div class="screen-label">Màn hình chiếu</div>
                    </div>

                    <div id="seatMap" class="seat-map" th:attr="data-price=${showtime.price}">
                        <div class="seat-row" th:each="rowEntry : ${seatsByRow}">
                            <span class="seat-row-label" th:text="${rowEntry.key}"></span>
                            <div th:each="seat : ${rowEntry.value}"
                                 class="seat"
                                 th:classappend="${seat.booked} ? 'booked' : ${seat.seatType}"
                                 th:attr="data-seat-id=${seat.seatId}, data-seat-label=${seat.label}, title=${seat.label + ' (' + seat.seatType.toUpperCase() + ')'}"
                                 th:text="${seat.seatNumber}">
                            </div>
                            <span class="seat-row-label" th:text="${rowEntry.key}"></span>
                        </div>
                    </div>

                    <div class="seat-legend">
                        <span class="seat-legend-item">
                            <span class="seat-legend-box seat standard"></span> Ghế thường
                        </span>
                        <span class="seat-legend-item">
                            <span class="seat-legend-box seat vip"></span> Ghế VIP
                        </span>
                        <span class="seat-legend-item">
                            <span class="seat-legend-box seat selected"></span> Đang chọn
                        </span>
                        <span class="seat-legend-item">
                            <span class="seat-legend-box seat booked"></span> Đã đặt
                        </span>
                    </div>
                </div>
            </div>

            <!-- Right: Ticket Summary Sidebar -->
            <div class="col-lg-4">
                <div class="ticket-card">
                    <div class="ticket-header">
                        <div class="small text-secondary text-uppercase fw-bold mb-1" style="letter-spacing: 0.08em;">Thông tin vé</div>
                        <h5 class="fw-bold mb-1" th:text="${showtime.movie.title}"></h5>
                        <div class="small text-light opacity-75">
                            <span th:text="${showtime.movie.genre}"></span>
                            &middot; <span th:text="${showtime.movie.durationMinutes} + ' phút'"></span>
                        </div>
                    </div>
                    <div class="ticket-body">
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted"><i class="bi bi-door-open me-1"></i>Phòng chiếu</span>
                            <strong class="text-dark" th:text="${showtime.room.roomName}"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted"><i class="bi bi-calendar-event me-1"></i>Suất chiếu</span>
                            <strong class="text-dark" th:text="${#temporals.format(showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted"><i class="bi bi-tag me-1"></i>Đơn giá vé</span>
                            <strong class="text-dark" th:text="${#numbers.formatInteger(showtime.price, 1, 'POINT')} + 'đ / ghế'"></strong>
                        </div>

                        <div class="ticket-divider"></div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2 small">
                                <span class="text-muted fw-semibold">Ghế đang chọn (<b id="selectedCount" class="text-danger">0</b>)</span>
                            </div>
                            <div id="selectedSeatsList" class="d-flex flex-wrap gap-1 min-vh-25">
                                <span class="text-muted small fst-italic">Chưa chọn ghế nào</span>
                            </div>
                        </div>

                        <div class="p-3 rounded-3 bg-light border d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-semibold text-secondary small">Tổng cộng</span>
                            <span id="totalAmount" class="fs-4 fw-bold text-danger">0đ</span>
                        </div>

                        <button type="submit" id="bookBtn" class="btn btn-cb-primary w-100 py-2" disabled>
                            Tiếp tục thanh toán <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                        <a th:href="@{/movies/{id}(id=${showtime.movie.movieId})}" class="btn btn-link btn-sm text-muted text-decoration-none w-100 mt-2">
                            <i class="bi bi-arrow-left me-1"></i> Đổi suất chiếu khác
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/seat-select.js"></script>
</body>
</html>
