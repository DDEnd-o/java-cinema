<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Thanh toán - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content" style="max-width: 920px;">
    <!-- Booking Stepper -->
    <div class="booking-stepper">
        <div class="step-item done">
            <span class="step-num"><i class="bi bi-check"></i></span>
            <span>Chọn ghế ngồi</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item active">
            <span class="step-num">2</span>
            <span>Thanh toán</span>
        </div>
        <div class="step-divider"></div>
        <div class="step-item">
            <span class="step-num">3</span>
            <span>Nhận vé điện tử</span>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4 align-items-start">
        <!-- Left: Payment Methods -->
        <div class="col-md-7">
            <div class="bg-white rounded-4 border p-4 shadow-sm">
                <h5 class="fw-bold mb-1"><i class="bi bi-credit-card-2-front text-danger me-2"></i>Phương thức thanh toán</h5>
                <p class="text-muted small mb-4">Vui lòng chọn hình thức thanh toán (mô phỏng) để hoàn tất giữ ghế.</p>

                <form th:action="@{/booking/{id}/payment(id=${booking.bookingId})}" method="post">
                    <label class="payment-option-label">
                        <input type="radio" name="method" value="cash" class="form-check-input mt-0" checked/>
                        <span class="payment-icon-box bg-success bg-opacity-10 text-success">
                            <i class="bi bi-cash-coin"></i>
                        </span>
                        <div>
                            <div class="fw-bold text-dark">Tiền mặt tại quầy vé</div>
                            <div class="small text-muted">Thanh toán trực tiếp cho nhân viên khi nhận vé tại rạp</div>
                        </div>
                    </label>

                    <label class="payment-option-label">
                        <input type="radio" name="method" value="card" class="form-check-input mt-0"/>
                        <span class="payment-icon-box bg-primary bg-opacity-10 text-primary">
                            <i class="bi bi-credit-card"></i>
                        </span>
                        <div>
                            <div class="fw-bold text-dark">Thẻ ngân hàng (ATM / Visa / MasterCard)</div>
                            <div class="small text-muted">Thanh toán trực tuyến an toàn qua cổng thẻ nội địa và quốc tế</div>
                        </div>
                    </label>

                    <label class="payment-option-label">
                        <input type="radio" name="method" value="ewallet" class="form-check-input mt-0"/>
                        <span class="payment-icon-box bg-danger bg-opacity-10 text-danger">
                            <i class="bi bi-wallet2"></i>
                        </span>
                        <div>
                            <div class="fw-bold text-dark">Ví điện tử (MoMo / ZaloPay / VNPay)</div>
                            <div class="small text-muted">Quét mã nhanh chóng, nhận vé điện tử tức thì</div>
                        </div>
                    </label>

                    <button type="submit" class="btn btn-cb-primary w-100 py-2 mt-2">
                        <i class="bi bi-shield-check me-1"></i> Xác nhận thanh toán
                        (<span th:text="${#numbers.formatInteger(booking.totalAmount, 1, 'POINT')} + 'đ'"></span>)
                    </button>
                </form>
            </div>
        </div>

        <!-- Right: Order Summary Ticket -->
        <div class="col-md-5">
            <div class="ticket-card">
                <div class="ticket-header">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="small text-secondary text-uppercase fw-bold" style="letter-spacing: 0.08em;">Đơn đặt vé</span>
                        <span class="badge bg-warning text-dark">Mã #<span th:text="${booking.bookingId}"></span></span>
                    </div>
                    <h5 class="fw-bold mb-0" th:text="${booking.showtime.movie.title}"></h5>
                </div>
                <div class="ticket-body">
                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Phòng chiếu</span>
                        <strong th:text="${booking.showtime.room.roomName}"></strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Suất chiếu</span>
                        <strong th:text="${#temporals.format(booking.showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></strong>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2 small">
                        <span class="text-muted">Ghế đã chọn</span>
                        <div class="d-flex flex-wrap gap-1 justify-content-end">
                            <span th:each="bs : ${bookingSeats}" class="seat-badge-pill" th:text="${bs.seat.label}"></span>
                        </div>
                    </div>

                    <div class="ticket-divider"></div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted fw-semibold">Tổng thanh toán</span>
                        <span class="fs-4 fw-bold text-danger" th:text="${#numbers.formatInteger(booking.totalAmount, 1, 'POINT')} + 'đ'"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
