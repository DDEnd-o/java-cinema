<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lịch sử vé - CinemaBooking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content">
    <div class="cb-section-header">
        <h3 class="cb-section-title">
            <span class="cb-section-dot"></span>
            Lịch sử vé đã đặt
        </h3>
        <a href="/" class="btn btn-cb-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i> Đặt thêm vé mới
        </a>
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
        <i class="bi bi-ticket-perforated fs-1 text-muted"></i>
        <h5 class="fw-bold mt-3 mb-1">Bạn chưa có đơn đặt vé nào</h5>
        <p class="text-muted small mb-3">Hãy chọn một bộ phim yêu thích và đặt vé ngay hôm nay!</p>
        <a href="/" class="btn btn-cb-primary">Khám phá phim đang chiếu</a>
    </div>

    <div class="cb-table-card" th:if="${!#lists.isEmpty(bookings)}">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Mã vé</th>
                    <th>Bộ phim</th>
                    <th>Suất chiếu &amp; Phòng</th>
                    <th>Ghế ngồi</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thời điểm đặt</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td>
                        <span class="fw-bold font-monospace text-dark">#<span th:text="${b.bookingId}"></span></span>
                    </td>
                    <td>
                        <a th:href="@{/movies/{id}(id=${b.showtime.movie.movieId})}" class="fw-bold text-dark text-decoration-none"
                           th:text="${b.showtime.movie.title}"></a>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${#temporals.format(b.showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></div>
                        <span class="badge bg-light text-secondary border" th:text="${b.showtime.room.roomName}"></span>
                    </td>
                    <td>
                        <span class="seat-badge-pill" th:text="${seatLabelsByBooking.get(b.bookingId)}"></span>
                    </td>
                    <td>
                        <span class="fw-bold text-danger" th:text="${#numbers.formatInteger(b.totalAmount, 1, 'POINT')} + 'đ'"></span>
                    </td>
                    <td>
                        <span th:switch="${b.status.name()}">
                            <a th:case="'paid'" th:href="@{/booking/{id}/confirmation(id=${b.bookingId})}"
                               class="badge bg-success text-decoration-none rounded-pill px-3 py-2">
                                <i class="bi bi-check-circle me-1"></i>Đã thanh toán
                            </a>
                            <a th:case="'pending'" th:href="@{/booking/{id}/payment(id=${b.bookingId})}"
                               class="badge bg-warning text-dark text-decoration-none rounded-pill px-3 py-2">
                                <i class="bi bi-hourglass-split me-1"></i>Chờ thanh toán (Thanh toán ngay)
                            </a>
                            <span th:case="*" class="badge bg-secondary rounded-pill px-3 py-2">Đã hủy</span>
                        </span>
                    </td>
                    <td class="text-muted small" th:text="${#temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
