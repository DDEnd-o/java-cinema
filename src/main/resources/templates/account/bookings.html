<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Vé của tôi - CINEBOOKING</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container page-content mt-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
            <div class="small text-warning fw-bold text-uppercase">Tài khoản thành viên</div>
            <h3 class="cinema-heading fw-black text-uppercase text-white mb-0">Kho Vé Điện Tử &amp; Lịch Sử Đặt Vé</h3>
        </div>
        <a href="/#scheduleSection" class="btn btn-cb-primary btn-sm">
            <i class="bi bi-ticket-perforated-fill"></i> Đặt Thêm Vé Mới
        </a>
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 rounded-4 border" style="background: var(--cinema-card);">
        <i class="bi bi-ticket-perforated fs-1 text-muted"></i>
        <h5 class="fw-bold text-white mt-3 mb-1">Bạn chưa có vé xem phim nào</h5>
        <p class="text-muted small mb-3">Hãy chọn suất chiếu yêu thích và trải nghiệm phòng chiếu chuẩn IMAX ngay hôm nay!</p>
        <a href="/" class="btn btn-cb-primary">Khám Phá Phim Đang Chiếu</a>
    </div>

    <!-- Visual E-Ticket Cards Grid -->
    <div class="row g-3" th:if="${!#lists.isEmpty(bookings)}">
        <div class="col-lg-6" th:each="b : ${bookings}">
            <div class="p-3 rounded-4 h-100 d-flex gap-3 align-items-center"
                 style="background: var(--cinema-card); border: 1px solid var(--cinema-border-strong);">
                <a th:href="@{/movies/{id}(id=${b.showtime.movie.movieId})}" class="flex-shrink-0">
                    <img th:src="${b.showtime.movie.posterUrl != null and !#strings.isEmpty(b.showtime.movie.posterUrl) ? b.showtime.movie.posterUrl : 'https://picsum.photos/seed/cinema/200/300'}"
                         alt="poster" class="rounded-3 border"
                         style="width: 88px; height: 130px; object-fit: cover;"
                         onerror="this.src='https://picsum.photos/seed/fallback/200/300'"/>
                </a>

                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="font-monospace fw-bold text-warning small">Mã vé #<span th:text="${b.bookingId}"></span></span>
                        <span th:switch="${b.status.name()}">
                            <span th:case="'paid'" class="badge bg-success">Đã thanh toán</span>
                            <span th:case="'pending'" class="badge bg-warning text-dark">Chờ thanh toán</span>
                            <span th:case="*" class="badge bg-secondary">Đã hủy</span>
                        </span>
                    </div>

                    <a th:href="@{/movies/{id}(id=${b.showtime.movie.movieId})}" class="text-decoration-none">
                        <h6 class="cinema-heading fw-bold text-uppercase text-white mb-1" th:text="${b.showtime.movie.title}"></h6>
                    </a>

                    <div class="small text-muted mb-2">
                        <i class="bi bi-calendar-event text-danger me-1"></i>
                        <strong class="text-light" th:text="${#temporals.format(b.showtime.startTime, 'HH:mm - dd/MM/yyyy')}"></strong>
                        &middot; <span class="text-info fw-semibold" th:text="${b.showtime.room.roomName}"></span>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center pt-2 border-top gap-2">
                        <div>
                            <span class="small text-muted me-1">Ghế:</span>
                            <span class="seat-badge-pill" th:text="${seatLabelsByBooking.get(b.bookingId)}"></span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <strong class="text-warning" th:text="${#numbers.formatInteger(b.totalAmount, 1, 'POINT')} + 'đ'"></strong>
                            <a th:if="${b.status.name() == 'paid'}"
                               th:href="@{/booking/{id}/confirmation(id=${b.bookingId})}"
                               class="btn btn-sm btn-outline-light rounded-3 py-1 px-2">
                                <i class="bi bi-qr-code"></i> Xem vé
                            </a>
                            <a th:if="${b.status.name() == 'pending'}"
                               th:href="@{/booking/{id}/payment(id=${b.bookingId})}"
                               class="btn btn-sm btn-cb-primary py-1 px-2">
                                Thanh toán
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
